[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-risk-agent"
version = "0.1.0"
description = "Auditable financial-risk analysis application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "autogen-agentchat>=0.7,<0.8",
  "autogen-ext[openai]>=0.7,<0.8",
  "pydantic>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.36,<2",
  "torch>=2.4,<3",
  "torch-geometric>=2.6,<3",
  "transformers>=4.45,<5",
]
license = { text = "Proprietary" }
authors = [{ name = "Financial Risk Agent Team" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "preserve"
